  <body class="bg-slate-50 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script>
      (function() {
        function removeLovableBadges() {
          const selectors = [
            '#lovable-badge',
            '[id*="lovable"]',
            '[class*="lovable"]',
            'a[href*="lovable.dev"]',
            'a[href*="lovable.app"]'
          ];
          selectors.forEach(function(sel) {
            document.querySelectorAll(sel).forEach(function(el) {
              el.remove();
            });
          });
          // Also check text content for "Edit with Lovable" or "Made with Lovable"
          document.querySelectorAll('div, button, a, span').forEach(function(el) {
            if (el.childNodes.length <= 3 && /edit with lovable|made with lovable/i.test(el.textContent || '')) {
              el.remove();
            }
          });
        }
        removeLovableBadges();
        const observer = new MutationObserver(removeLovableBadges);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
